<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>דיווח מהשטח — חמ״ל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plane:#eef1f5; --s1:#fff; --s3:#eef2f7;
  --line:rgba(15,27,45,.12); --ink:#0f1b2d; --ink2:#4c5c70; --ink3:#7d8da1;
  --navy:#0b2e5b; --navy2:#17406f; --gold:#B07D1F; --crit:#d03b3b; --done:#0ca30c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:var(--plane);color:var(--ink);
     font:400 16px/1.55 Assistant,"Segoe UI",system-ui,-apple-system,sans-serif;
     -webkit-font-smoothing:antialiased;padding-bottom:40px}
header{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;
       padding:18px 20px calc(18px + env(safe-area-inset-top));
       display:flex;align-items:center;gap:12px}
header .mark{width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--gold),#8c5f12);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:17px}
header h1{margin:0;font-size:19px;font-weight:700}
header p{margin:2px 0 0;font-size:13px;color:#9db6d4}
main{max-width:560px;margin:0 auto;padding:18px 16px 0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;
      box-shadow:0 1px 2px rgba(15,27,45,.06),0 10px 24px -18px rgba(15,27,45,.4)}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px;color:var(--ink2)}
label:first-child{margin-top:0}
label b{color:var(--crit);font-weight:600}
input,select,textarea{width:100%;background:var(--s1);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:12px 14px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2a78d6;box-shadow:0 0 0 3px rgba(42,120,214,.15)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.two{display:flex;gap:10px}
.two>div{flex:1 1 0;min-width:0}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cats input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;
  margin:0;padding:0;border:0;clip:rect(0 0 0 0);overflow:hidden}
.cats label{margin:0;display:inline-block;border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-size:14.5px;font-weight:500;color:var(--ink2);background:var(--s1);cursor:pointer}
.cats input:checked+label{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.urg{display:flex;align-items:center;gap:11px;margin-top:18px;padding:13px 15px;
     border:1px solid #f3c2c2;background:#fdf4f4;border-radius:12px;cursor:pointer}
.urg input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--crit)}
.urg span{font-size:15px;font-weight:600;color:#a51f1e}
.urg small{display:block;font-weight:400;color:#8a5050;font-size:13px}
button{width:100%;margin-top:20px;background:var(--navy);color:#fff;border:none;border-radius:12px;
       padding:16px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
button:hover:not(:disabled){background:var(--navy2)}
.hint{font-size:13px;color:var(--ink3);margin-top:14px;text-align:center;line-height:1.6}
.err{display:none;background:#fdeaea;border:1px solid #f3c2c2;color:#a51f1e;border-radius:11px;
     padding:12px 14px;font-size:14.5px;margin-top:14px}
/* מסך התודה */
.ok{display:none;text-align:center;padding:30px 20px}
.ok .v{width:68px;height:68px;border-radius:50%;background:#e9f7ea;border:2px solid #9bd79f;
       color:#0a7a0a;font-size:34px;line-height:64px;margin:0 auto 16px}
.ok h2{margin:0 0 6px;font-size:22px}
.ok p{margin:0 0 20px;color:var(--ink2);font-size:15px}
.ok button{background:var(--s1);color:var(--navy);border:1px solid var(--navy)}
.as{font-size:13.5px;color:var(--ink3);margin:0 0 14px}
.as a{color:var(--navy);cursor:pointer;text-decoration:underline}
.sum{text-align:right;background:var(--s3);border-radius:11px;padding:13px 15px;font-size:14.5px;
     color:var(--ink2);margin-bottom:18px;white-space:pre-wrap}
</style>
</head>

  <div class="mark">ח</div>
  <div>
    <h1>דיווח מהשטח</h1>
    <p>מטה הבחירות הארצי · ישראל ביתנו</p>
  </div>
</header>

<script>
"use strict";
var EP = "https://script.google.com/macros/s/AKfycbzmr-tZBaAGqY3AgKxWwoe89qzObQY6A9wS9XW9L3vMIkbXCxTbbqon7hHj_SGI3V8J/exec";
var $ = function (s) { return document.querySelector(s); };
var CATS = ["משקיפים", "הסעות", "ציוד", "הפרעה", "משפטי", "נתונים", "כללי"];

$("#cats").innerHTML = CATS.map(function (c, i) {
  var id = "c" + i;
  return '<input type="radio" name="cat" id="' + id + '" value="' + c + '"' +
         (c === "כללי" ? " checked" : "") + '><label for="' + id + '">' + c + "</label>";
}).join("");

/* זוכרים שם וטלפון במכשיר — מי שמדווח פעם אחת ידווח גם שוב */
try {
  $("#name").value = localStorage.getItem("hamal-r-name") || "";
  $("#tel").value = localStorage.getItem("hamal-r-tel") || "";
  $("#city").value = localStorage.getItem("hamal-r-city") || "";
} catch (e) {}

var jc = 0;
function jsonp(url, cb) {
  var n = "__r" + (++jc), s = document.createElement("script"), done = false;
  var kill = function () { try { delete window[n]; } catch (e) { window[n] = void 0; }
                           if (s.parentNode) s.parentNode.removeChild(s); };
  window[n] = function (d) { if (done) return; done = true; kill(); cb(null, d); };
  s.onerror = function () { if (done) return; done = true; kill(); cb(new Error("net")); };
  setTimeout(function () { if (!done) { done = true; kill(); cb(new Error("timeout")); } }, 15000);
  s.src = url + (url.indexOf("?") > -1 ? "&" : "?") + "callback=" + n + "&_=" + Date.now();
  document.head.appendChild(s);
}
function fail(msg) {
  var e = $("#err"); e.textContent = msg; e.style.display = "block";
  $("#send").disabled = false; $("#send").textContent = "שלח לחמ״ל";
}

/* הודעת השגיאה נעלמת ברגע שמתקנים — אחרת היא נשארת על המסך אחרי שכבר מילאו */
document.addEventListener("input", function () { $("#err").style.display = "none"; });

$("#send").onclick = function () {
  $("#err").style.display = "none";
  var name = $("#name").value.trim(), tel = $("#tel").value.trim();
  var city = $("#city").value.trim(), spot = $("#spot").value.trim();
  var kalpi = $("#kalpi").value.replace(/\D/g, "");
  var body = $("#text").value.trim();
  var cat = (document.querySelector('input[name=cat]:checked') || {}).value || "כללי";
  var urg = $("#urg").checked;

  if (!name) return fail("צריך שם — בחמ״ל צריכים לדעת למי לחזור.");
  if (tel.replace(/\D/g, "").length < 9) return fail("צריך מספר טלפון תקין.");
  if (!city) return fail("צריך יישוב, אחרת אי אפשר לסמן את זה על המפה.");
  if (body.length < 5) return fail("כתוב במשפט מה קורה.");

  /* הסוגריים המרובעים בהתחלה הם מה שהמפה מחפשת כדי לזהות את היישוב,
     ומיד אחריהם המקום המדויק — משם היא מתקרבת עד הנקודה. */
  var text = "[" + city + "] " + (spot ? spot + " — " : "") +
             (kalpi ? "קלפי " + kalpi + " — " : "") + body;

  try {
    localStorage.setItem("hamal-r-name", name);
    localStorage.setItem("hamal-r-tel", tel);
    localStorage.setItem("hamal-r-city", city);
  } catch (e) {}

  $("#send").disabled = true; $("#send").textContent = "שולח…";
  jsonp(EP + "?from=" + encodeURIComponent(tel) + "&name=" + encodeURIComponent(name) +
        "&text=" + encodeURIComponent(text) + "&cat=" + encodeURIComponent(cat) +
        (urg ? "&urg=" + encodeURIComponent("דחוף") : "") + "&src=form",
    function (err, d) {
      if (err || !d || !d.ok) return fail("השליחה נכשלה. בדוק חיבור לאינטרנט ונסה שוב.");
      $("#sum").textContent = text;
      $("#as").innerHTML = "מדווח: <b>" + name.replace(/[<&>]/g, "") + "</b> · " +
                           tel.replace(/[<&>]/g, "") +
                           ' &nbsp;<a id="swap">זה לא אני</a>';
      clearForm(false);                 /* הטופס שמאחורי מסך התודה כבר ריק */
      $("#form").style.display = "none";
      $("#ok").style.display = "block";
      window.scrollTo(0, 0);
    });
};

/* אחרי שליחה הטופס חוזר ריק. מה שנשאר זה רק מי מדווח — שם, טלפון
   ויישוב — כי אותו אדם מדווח שוב מאותו מקום, ואין טעם להקליד הכול
   מחדש. גם זה מוצג לו במפורש עם אפשרות להחליף. */
function clearForm(all) {
  $("#text").value = ""; $("#spot").value = ""; $("#kalpi").value = "";
  $("#urg").checked = false;
  var g = document.getElementById("c6");           /* "כללי" */
  if (g) g.checked = true;
  if (all) {
    $("#name").value = ""; $("#tel").value = ""; $("#city").value = "";
    try { localStorage.removeItem("hamal-r-name"); localStorage.removeItem("hamal-r-tel");
          localStorage.removeItem("hamal-r-city"); } catch (e) {}
  }
  $("#err").style.display = "none";
  $("#send").disabled = false; $("#send").textContent = "שלח לחמ״ל";
}
function backToForm() {
  $("#ok").style.display = "none"; $("#form").style.display = "block";
  window.scrollTo(0, 0); $("#text").focus();
}
$("#again").onclick = function () { clearForm(false); backToForm(); };
document.getElementById("as").onclick = function (e) {
  if (e.target.id !== "swap") return;
  clearForm(true); backToForm(); $("#name").focus();
};
</script>
</body>
</html>
