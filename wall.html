<script>
(function () {
  var SALT = "0d57789a0d457bece0e547715a541bab", IV = "ebfa4c22717ec0cab5491e8e", IT = 200000, KEY = "mate-pw-v1-hamal";
  var KKEY = KEY + "-k";   /* המפתח הגזור עצמו — ראה הערה למטה */
  var $ = function (i) { return document.getElementById(i); };

  function hex(h) {
    var a = new Uint8Array(h.length / 2);
    for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16);
    return a;
  }
  function b64(s) {
    var bin = atob(s.replace(/\s+/g, "")), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function show(buf) {
    var html = new TextDecoder("utf-8").decode(buf);
    /* document.write בזמן שהדפדפן עוד מנתח את הדף מוסיף במקום להחליף, ואז
       מסך הסיסמה נשאר תקוע מעל התוכן. מאז שהפתיחה הפכה מיידית (מפתח שמור)
       זה בדיוק מה שקרה — אז מחכים לסיום הניתוח לפני ההחלפה. */
    var go = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go);
    else go();
  }
  function decrypt(k) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: hex(IV) }, k, b64($("d").textContent));
  }
  function toHex(buf) {
    var a = new Uint8Array(buf), o = "";
    for (var i = 0; i < a.length; i++) o += ("0" + a[i].toString(16)).slice(-2);
    return o;
  }

  /* גזירת המפתח מהסיסמה היא 200,000 סיבובים — בכוונה, כדי שניחוש סיסמאות
     יהיה יקר. אבל זה גם שנייה-שתיים המתנה בכל פתיחה. לכן אחרי הפתיחה
     הראשונה שומרים את המפתח הגזור עצמו, והפתיחות הבאות מיידיות.
     מבחינת אבטחה זה אותו דבר: מי שיש לו גישה לדפדפן הזה ממילא נכנס. */
  function open_(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function (k) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: hex(SALT), iterations: IT, hash: "SHA-256" },
          k, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      })
      .then(function (k) {
        return decrypt(k).then(function (buf) {
          try {
            localStorage.setItem(KEY, pw);
            crypto.subtle.exportKey("raw", k).then(function (raw) {
              try { localStorage.setItem(KKEY, toHex(raw)); } catch (e) {}
            });
          } catch (e) {}
          show(buf);
        });
      });
  }
  function openFast(kh) {
    return crypto.subtle.importKey("raw", hex(kh), { name: "AES-GCM" }, false, ["decrypt"])
      .then(decrypt).then(show);
  }

  function go() {
    var pw = $("p").value;
    if (!pw) { $("p").focus(); return; }
    $("b").disabled = true; $("b").textContent = "פותח…"; $("e").textContent = "";
    open_(pw).catch(function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      $("b").disabled = false; $("b").textContent = "כניסה";
      $("e").textContent = "סיסמה שגויה";
      $("p").value = ""; $("p").focus();
    });
  }

  $("b").onclick = go;
  $("p").onkeydown = function (e) { if (e.key === "Enter") go(); };

  if (!window.crypto || !crypto.subtle) {
    $("e").textContent = "הדפדפן הזה ישן מדי. נסה כרום או אדג׳ מעודכנים.";
    $("b").disabled = true;
  } else {
    var saved = null, savedKey = null;
    try { saved = localStorage.getItem(KEY); savedKey = localStorage.getItem(KKEY); } catch (e) {}
    var fallback = function () {
      try { localStorage.removeItem(KEY); localStorage.removeItem(KKEY); } catch (e) {}
      $("b").disabled = false; $("b").textContent = "כניסה";
    };
    if (savedKey && /^[0-9a-f]{64}$/.test(savedKey)) {
      $("b").disabled = true; $("b").textContent = "פותח…";
      openFast(savedKey).catch(function () {
        /* המפתח לא מתאים לדף הזה (הדף עודכן) — חוזרים לדרך הארוכה */
        try { localStorage.removeItem(KKEY); } catch (e) {}
        if (saved) open_(saved).catch(fallback); else fallback();
      });
    } else if (saved) {
      $("b").disabled = true; $("b").textContent = "פותח…";
      open_(saved).catch(fallback);
    }
  }
})();
