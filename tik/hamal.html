<!DOCTYPE html>
<html lang="he" dir="rtl"><head>

S.getItem=function(k){return g.call(this,P+k)};S.setItem=function(k,v){return s.call(this,P+k,v)};S.removeItem=function(k){return r.call(this,P+k)};
var F=IDBFactory.prototype,o=F.open,d=F.deleteDatabase;F.open=function(n,v){return v===undefined?o.call(this,"demo-"+n):o.call(this,"demo-"+n,v)};
F.deleteDatabase=function(n){return d.call(this,"demo-"+n)};}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>דשבורד החמ״ל · הדגמה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

:root{
  --plane:#f7f7f8; --s1:#ffffff; --s2:#fafafa; --s3:#f1f1f3;
  --line:rgba(9,9,11,.09); --line2:rgba(9,9,11,.16); --line3:rgba(9,9,11,.055);
  --ink:#09090b; --ink2:#52525b; --ink3:#8e8e97;
  --acc:#1d4ed8; --accSoft:rgba(29,78,216,.10);
  --crit:#dc2626; --critSoft:#fef2f2; --critInk:#b42318;
  --work:#b45309; --workSoft:#fffbeb;
  --done:#15803d; --doneSoft:#f0fdf4;
  --legal:#6d28d9; --legalSoft:#f5f3ff;
  --gold:#a16207;
  --hdr:#ffffff; --hdrInk:#09090b; --hdrInk2:#71717a; --hdrLine:rgba(9,9,11,.10);
  --focus:0 0 0 3px rgba(29,78,216,.18);
  --r:8px; --r2:10px;
}
:root[data-theme="dark"]{
  --plane:#09090b; --s1:#141417; --s2:#18181c; --s3:#212126;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20); --line3:rgba(255,255,255,.06);
  --ink:#fafafa; --ink2:#a1a1aa; --ink3:#71717a;
  --acc:#60a5fa; --accSoft:rgba(96,165,250,.14);
  --crit:#f87171; --critSoft:rgba(248,113,113,.12); --critInk:#fca5a5;
  --work:#fbbf24; --workSoft:rgba(251,191,36,.12);
  --done:#4ade80; --doneSoft:rgba(74,222,128,.12);
  --legal:#a78bfa; --legalSoft:rgba(167,139,250,.13);
  --gold:#d4a017;
  --hdr:#111113; --hdrInk:#fafafa; --hdrInk2:#8b8b94; --hdrLine:rgba(255,255,255,.09);
  --focus:0 0 0 3px rgba(96,165,250,.26);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--plane);color:var(--ink);
     font:400 15px/1.55 Assistant,"Segoe UI",system-ui,-apple-system,sans-serif;
     -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}


header{flex:0 0 auto;padding:0 calc(20px*var(--sc));min-height:calc(56px*var(--sc));display:flex;align-items:center;gap:calc(18px*var(--sc));flex-wrap:wrap;
  background:var(--hdr);color:var(--hdrInk);border-bottom:1px solid var(--hdrLine);z-index:10}
.brand{display:flex;align-items:center;gap:calc(10px*var(--sc));min-width:0}
.brand .mark{width:calc(26px*var(--sc));height:calc(26px*var(--sc));border-radius:7px;flex:0 0 auto;background:var(--ink);
  color:var(--s1);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(13px*var(--sc))}
.brand h1{margin:0;font-size:calc(14.5px*var(--sc));font-weight:600;letter-spacing:-.15px;white-space:nowrap}
.brand p{display:none}
.live{display:flex;align-items:center;gap:calc(7px*var(--sc));font-size:calc(12.5px*var(--sc));color:var(--hdrInk2);
      padding-inline-start:calc(18px*var(--sc));border-inline-start:1px solid var(--hdrLine);white-space:nowrap}
.dot{width:calc(6px*var(--sc));height:calc(6px*var(--sc));border-radius:50%;background:var(--ink3);flex:0 0 auto}
.dot.ok{background:var(--done)}
.dot.err{background:var(--crit)}
.dot.demo{background:var(--work)}
.hb{color:var(--hdrInk2);border:none;background:none;border-radius:7px;padding:calc(6px*var(--sc)) calc(10px*var(--sc));
    font-size:calc(13px*var(--sc));font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;
    transition:background .12s,color .12s;white-space:nowrap}
.hb:hover{background:var(--s3);color:var(--hdrInk)}


.stats{display:flex;align-items:stretch;margin-inline-start:auto;
       border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--s1)}
.stat{display:flex;align-items:baseline;gap:calc(7px*var(--sc));padding:calc(7px*var(--sc)) calc(14px*var(--sc));white-space:nowrap}
.stat+.stat{border-inline-start:1px solid var(--line3)}
.stat b{font-size:calc(17px*var(--sc));font-weight:600;letter-spacing:-.3px;color:var(--ink);
        font-variant-numeric:tabular-nums}
.stat span{font-size:calc(11.5px*var(--sc));color:var(--ink3);font-weight:500}
.stat.u b{color:var(--ink3)}
.stat.u.hot b{color:var(--crit)}


.bar{flex:0 0 auto;padding:calc(9px*var(--sc)) calc(20px*var(--sc));display:flex;align-items:center;gap:calc(6px*var(--sc));flex-wrap:wrap;
     background:var(--s1);border-bottom:1px solid var(--line)}
.chip{border:1px solid transparent;background:none;color:var(--ink2);border-radius:7px;
      padding:calc(5px*var(--sc)) calc(11px*var(--sc));font-size:calc(13px*var(--sc));font-weight:500;cursor:pointer;user-select:none;white-space:nowrap;
      transition:background .12s,color .12s}
.chip:hover{background:var(--s3);color:var(--ink)}
.chip.on{background:var(--s3);color:var(--ink);font-weight:600;border-color:var(--line)}
#cUrg.on{background:var(--critSoft);color:var(--critInk);border-color:transparent}
.sep{width:1px;height:calc(20px*var(--sc));background:var(--line);margin:0 calc(6px*var(--sc))}
input[type=text],input[type=url],input[type=number]{
  background:var(--s1);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r);padding:calc(6px*var(--sc)) calc(11px*var(--sc));font-size:calc(13px*var(--sc));transition:border-color .12s,box-shadow .12s}
input::placeholder{color:var(--ink3)}
input:focus{outline:none;border-color:var(--acc);box-shadow:var(--focus)}
.grow{flex:1 1 180px;min-width:140px;max-width:300px}
button{background:var(--s1);border:1px solid var(--line);color:var(--ink2);border-radius:var(--r);
       padding:calc(5px*var(--sc)) calc(11px*var(--sc));font-size:calc(13px*var(--sc));font-weight:500;cursor:pointer;
       transition:background .12s,color .12s,border-color .12s}
button:hover{background:var(--s3);color:var(--ink)}
button:focus-visible{outline:none;box-shadow:var(--focus)}
button.on{background:var(--s3);color:var(--ink);font-weight:600}
button.p{background:var(--ink);border-color:var(--ink);color:var(--s1);font-weight:600}
button.p:hover{opacity:.88;background:var(--ink);color:var(--s1)}
button.g{color:var(--done);border-color:var(--line)}
button.g:hover{background:var(--doneSoft);color:var(--done)}
button.del{color:var(--ink3);border-color:transparent;background:transparent}
button.del:hover{background:var(--critSoft);color:var(--critInk)}
button.del.cfm{background:var(--crit);border-color:var(--crit);color:#fff;font-weight:600}


.pill{border-radius:5px;padding:1px 7px;font-weight:500;font-size:11.5px;
      color:var(--ink2);background:var(--s3);white-space:nowrap}
.pill.crit{background:var(--critSoft);color:var(--critInk);font-weight:600}
.pill.legal{background:var(--legalSoft);color:var(--legal)}
.pill.own{background:var(--s3);color:var(--ink2)}
.pill.demo{background:var(--workSoft);color:var(--work)}
.pill.loc{background:var(--s3);color:var(--ink2)}
.pill.klf{background:var(--s3);color:var(--ink2);font-variant-numeric:tabular-nums}
.tel{cursor:pointer;border-bottom:1px dotted var(--line2)}
.tel.shown{border-bottom-color:transparent;cursor:default}


.ov{position:fixed;inset:0;background:rgba(9,9,11,.5);backdrop-filter:blur(3px);
    display:none;z-index:50;padding:26px;overflow:auto}
.ov.open{display:block}
.sheetbox{max-width:760px;margin:0 auto;background:var(--s1);border:1px solid var(--line);
          border-radius:14px;padding:22px 26px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
.sheetbox h3{margin:0 0 4px;font-size:18px;font-weight:600}
.sheetbox h4{margin:22px 0 7px;font-size:13px;font-weight:600;color:var(--ink);
             text-transform:none;letter-spacing:0}
.sheetbox p,.sheetbox li{font-size:14px;color:var(--ink2)}
.sheetbox ol{padding-inline-start:20px;margin:6px 0}
.sheetbox code{background:var(--s3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
               font-family:ui-monospace,Consolas,monospace;font-size:12.5px;direction:ltr;display:inline-block}
pre{background:var(--s2);border:1px solid var(--line);border-radius:var(--r2);padding:12px;direction:ltr;
    text-align:left;max-height:200px;overflow:auto;font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{font-size:13.5px;color:var(--ink3);min-width:96px}
.note{background:var(--workSoft);border:1px solid var(--line);border-radius:var(--r2);padding:11px 14px;
      font-size:13.5px;color:var(--ink2);margin:11px 0}
.x{float:left;background:none;border:none;color:var(--ink3);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.x:hover{background:none;color:var(--ink)}
.empty{color:var(--ink3);text-align:center;padding:26px 10px;font-size:13px}


:root{ --sc:1; }
.board{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
       gap:0;overflow:hidden;min-height:0;background:var(--s1)}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col+.col{border-inline-start:1px solid var(--line)}


body.focus .board{grid-template-columns:repeat(2,minmax(0,1fr))}
body.focus .col.hide{display:none}


.colh{display:flex;align-items:baseline;gap:calc(10px*var(--sc));flex:0 0 auto;
      padding:calc(18px*var(--sc)) calc(22px*var(--sc)) calc(13px*var(--sc))}
.colh h2{margin:0;font-size:calc(13px*var(--sc));font-weight:600;letter-spacing:.07em;color:var(--ink3)}
.colh b{font-size:calc(26px*var(--sc));font-weight:600;letter-spacing:-.5px;line-height:1;color:var(--ink)}
.colh .ln{flex:1 1 auto;height:1px;background:var(--line);align-self:center;margin:0 2px}
.colh em{font-style:normal;font-size:calc(12.5px*var(--sc));font-weight:600;color:var(--crit);white-space:nowrap}
.colh em:empty{display:none}


.col .body{overflow-y:auto;flex:1 1 auto;min-height:0;padding-bottom:40px;
           scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.col .body::-webkit-scrollbar{width:11px}
.col .body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:11px;
  border:3px solid var(--s1);background-clip:padding-box}


.grp{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:calc(9px*var(--sc));
     padding:calc(10px*var(--sc)) calc(22px*var(--sc)) calc(9px*var(--sc));
     background:var(--s2);border-bottom:1px solid var(--line3);border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp h3{margin:0;font-size:calc(13.5px*var(--sc));font-weight:600;color:var(--ink2);white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
.grp .n{font-size:calc(12px*var(--sc));color:var(--ink3);font-variant-numeric:tabular-nums}
.grp .u{margin-inline-start:auto;font-size:calc(12px*var(--sc));font-weight:600;color:var(--crit);white-space:nowrap}


.msg{position:relative;padding:calc(16px*var(--sc)) calc(22px*var(--sc)) calc(15px*var(--sc));
     border-bottom:1px solid var(--line3);transition:background .12s}
.msg:hover{background:var(--s2)}
.msg::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:transparent}
.msg.urg::before{background:var(--crit)}
.msg.lgl::before{background:var(--legal)}

.msg.dn{opacity:.5}
.msg.dn:hover{opacity:1}
.msg.fresh{animation:inB .45s cubic-bezier(.2,.7,.3,1)}
@keyframes inB{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.m1{display:flex;align-items:baseline;gap:calc(9px*var(--sc));margin-bottom:calc(7px*var(--sc))}
.m1 .who{font-size:calc(14px*var(--sc));font-weight:600;color:var(--ink);white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis;max-width:55%}
.msg.vip .m1 .who{color:var(--gold)}

.tkt{display:inline-flex;align-items:center;background:var(--accSoft);color:var(--acc);
  border-radius:6px;padding:1px 7px;font-size:calc(12px*var(--sc));font-weight:700;
  font-variant-numeric:tabular-nums;margin-inline-end:6px}
.own{font-size:calc(12.5px*var(--sc));color:var(--ink2);font-weight:600;margin-inline-start:6px}
.own b{color:var(--ink)}
.hist{display:block;margin-top:4px;font-size:calc(11.5px*var(--sc));color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cRef.on{background:var(--accSoft);color:var(--acc);border-color:transparent}
#selRef{background:var(--s1);border:1px solid var(--line2);color:var(--ink);border-radius:8px;
  padding:5px 9px;font:inherit;font-size:calc(13px*var(--sc));max-width:160px}
#selRef:focus{outline:none;border-color:var(--acc)}
#selRef.on{background:var(--accSoft);border-color:transparent;color:var(--acc);font-weight:600}
.m1 .tel{font-size:calc(12px*var(--sc));color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.m1 time{margin-inline-start:auto;font-size:calc(12.5px*var(--sc));color:var(--ink3);
         font-variant-numeric:tabular-nums;white-space:nowrap}
.mt{font-size:calc(16.5px*var(--sc));line-height:1.55;white-space:pre-wrap;word-break:break-word;
    margin:0 0 calc(12px*var(--sc));color:var(--ink)}
.msg.urg .mt{font-weight:500}


.m3{display:flex;align-items:center;gap:calc(6px*var(--sc));flex-wrap:wrap;font-size:calc(12.5px*var(--sc))}
.m3 .rel{color:var(--ink3);margin-inline-start:auto;display:flex;align-items:center;gap:calc(8px*var(--sc));
         font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{width:calc(48px*var(--sc));height:4px;background:var(--line);border-radius:4px;
       overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;background:var(--done);border-radius:4px;transition:width .4s}
.meter.warn i{background:var(--work)}
.meter.bad i{background:var(--crit)}
.m3 .rel.bad{color:var(--crit);font-weight:600}
.pill{font-size:calc(12.5px*var(--sc));padding:calc(2px*var(--sc)) calc(8px*var(--sc))}


.m2{display:flex;gap:calc(6px*var(--sc));flex-wrap:wrap;margin-top:calc(12px*var(--sc));
    max-height:0;opacity:0;overflow:hidden;transition:max-height .18s ease,opacity .18s ease}
.msg:hover .m2,.msg:focus-within .m2{max-height:120px;opacity:1}
.m2 button{padding:calc(5px*var(--sc)) calc(12px*var(--sc));font-size:calc(13.5px*var(--sc))}
@media (hover:none){.m2{max-height:120px;opacity:1}}


.msg.sm{padding:calc(9px*var(--sc)) calc(22px*var(--sc));display:flex;align-items:baseline;
        gap:calc(10px*var(--sc));cursor:pointer}
.msg.sm .m1,.msg.sm .m3,.msg.sm .m2{display:none}
.msg.sm .mt{margin:0;font-size:calc(15px*var(--sc));line-height:1.5;flex:1 1 auto;min-width:0;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.msg.sm .sm-t{font-size:calc(12px*var(--sc));color:var(--ink3);font-variant-numeric:tabular-nums;
              flex:0 0 auto;white-space:nowrap}
.msg.sm .sm-c{font-size:calc(12px*var(--sc));color:var(--ink3);flex:0 0 auto;white-space:nowrap;
              max-width:30%;overflow:hidden;text-overflow:ellipsis}
.msg.sm:hover .mt{color:var(--ink)}


.empty{color:var(--ink3);text-align:center;padding:calc(34px*var(--sc)) 10px;
       font-size:calc(13.5px*var(--sc))}


body.big{--sc:1.22}


body.tv .hb,
body.tv #q, body.tv #me, body.tv #selRef, body.tv #cRef,
body.tv #bDense{display:none}
body.tv .live{padding-inline-start:calc(14px*var(--sc))}
body.tv .bar{gap:calc(7px*var(--sc))}


@media (max-width:900px){
  html,body{height:auto;overflow:auto}
  body{display:block}
  .board{display:block;overflow:visible}
  body.focus .board{display:block}
  .col+.col{border-inline-start:0;border-top:1px solid var(--line)}
  .col,.col .body{display:block;overflow:visible}
  header{height:auto;padding:10px 14px;flex-wrap:wrap;gap:10px}
  .stats{margin-inline-start:0;width:100%}
  .stat{flex:1 1 0;justify-content:center;padding:7px 4px}
  .bar{padding:9px 14px}
  .colh,.grp,.msg{padding-inline:14px}
}

</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">ח</div>
    <div>
      <h1>חמ״ל — הודעות מהשטח</h1>
      <p>חמ״ל יום הבחירות · גרסת הדגמה</p>
    </div>
  </div>
  <div class="live"><i class="dot" id="dot"></i><span id="liveTxt">לא מחובר</span></div>
  <div class="stats">
    <div class="stat u"><b id="kU">0</b><span>דחוף</span></div>
    <div class="stat n"><b id="kN">0</b><span>חדש</span></div>
    <div class="stat w"><b id="kW">0</b><span>בטיפול</span></div>
    <div class="stat d"><b id="kD">0</b><span>טופל</span></div>
  </div>
</header>

<div class="bar">
  <span class="chip on" data-cat="*">הכול</span>
  <span class="chip" data-cat="משקיפים">משקיפים</span>
  <span class="chip" data-cat="הסעות">הסעות</span>
  <span class="chip" data-cat="ציוד">ציוד</span>
  <span class="chip" data-cat="הפרעה">הפרעה</span>
  <span class="chip" data-cat="משפטי">משפטי</span>
  <span class="chip" data-cat="כוח אדם">כוח אדם</span>
  <span class="chip" data-cat="נתונים">נתונים</span>
  <span class="chip" data-cat="כללי">כללי</span>
  <span class="sep"></span>
  <span class="chip" id="cUrg">רק דחוף</span>
  <span class="chip" id="cRef">קריאות רפרנטים</span>
  <select id="selRef" title="לראות רק את הקריאות של רפרנט אחד"><option value="">כל הרפרנטים</option></select>
  <input type="text" class="grow" id="q" placeholder="חיפוש בטקסט, בשולח או בעיר…">
  <input type="text" id="me" placeholder="השם שלי" style="width:112px">
  <button id="bMask" title="מסתיר את מספרי הטלפון על המסך">טלפונים מוסתרים</button>
  <button id="bSize" title="גודל הטקסט בלוח">גודל · רגיל</button>
  <button id="bLay" title="מסתיר את עמודת 'טופל' ונותן לשתי העמודות שעובדות את כל הרוחב">3 עמודות</button>
  <button id="bDense" title="מכווץ הודעות שאינן דחופות לשורה אחת">אוטומטי</button>
  <button id="bTheme" title="מעבר בין בהיר לכהה">כהה</button>
  <button id="bDemo">הדגמה</button>
</div>

<div class="board">
  <section class="col" data-st="חדש">
    <div class="colh"><h2>חדש</h2><b class="num" id="cN">0</b><span class="ln"></span><em id="uN"></em></div>
    <div class="body" id="lN"></div>
  </section>
  <section class="col" data-st="בטיפול">
    <div class="colh"><h2>בטיפול</h2><b class="num" id="cW">0</b><span class="ln"></span><em id="uW"></em></div>
    <div class="body" id="lW"></div>
  </section>
  <section class="col hide" data-st="טופל">
    <div class="colh"><h2>טופל</h2><b class="num" id="cD">0</b><span class="ln"></span><em id="uD"></em></div>
    <div class="body" id="lD"></div>
