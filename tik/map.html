.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

.leaflet-tile::selection {
	background: transparent;
}

.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}

.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

:root{
  --navy:#0B2E5B; --ink:#14202E; --ink2:#5A6A7D; --ink3:#8B98A8;

  --gbg:#EAF6EE; --gbd:#BFE3CC; --gtx:#1F7A45;
  --rbg:#FDEDEA; --rbd:#F3C4BA; --rtx:#B0402A;
  
  --q1:#86b6ef; --q2:#5598e7; --q3:#2a78d6; --q4:#1c5cab; --q5:#0d366b;
  --font:'Heebo',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none !important}

.app{display:flex;flex-direction:column;height:100vh}
.top{background:var(--navy);color:#fff;padding:6px 16px;display:flex;align-items:center;gap:7px 13px;flex:0 0 auto;z-index:800;flex-wrap:wrap}
.top h1{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.eyebrow{font-size:10px;letter-spacing:.15em;color:#9DB5D4;font-weight:700}
.sp{flex:1}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:9px;padding:3px;gap:3px}
.seg button{background:none;border:0;color:#CFE0F5;border-radius:7px;padding:4px 12px;font-weight:800;font-size:12.5px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy)}
.kpi{display:flex;gap:14px;align-items:center}
.kpi div{text-align:center;line-height:1.15}
.kpi b{display:block;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.kpi span{font-size:10px;color:#9DB5D4;font-weight:700;white-space:nowrap}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
  border-radius:8px;padding:5px 11px;font-weight:700;font-size:12px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.22)}
.tbtn.go{background:#fff;color:var(--navy);border-color:#fff}

.main{flex:1;display:flex;min-height:0;position:relative}

.mapmsg{position:absolute;inset-block-end:32px;inset-inline-end:14px;z-index:650;
  display:flex;flex-direction:column;gap:6px;align-items:flex-start;
  pointer-events:none;max-width:min(44vw,430px)}
.mapmsg .warn-pill{background:rgba(11,46,91,.93);max-width:none;
  box-shadow:0 5px 18px rgba(11,46,91,.28)}
#map{flex:1;min-width:0;background:#E8EDF2}
.side{width:340px;flex:0 0 auto;background:var(--card);border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.sh{padding:11px 15px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy);
  display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FBFCFE}
.sb{padding:0 15px 12px;overflow:auto;flex:1}

.qwrap{position:sticky;inset-block-start:0;z-index:6;background:var(--card);padding:12px 0 2px}
.srch{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:10px;font-size:13.5px}
.srch:focus{outline:none;border-color:var(--navy)}
.xlbtn{width:100%;margin:-4px 0 10px;padding:7px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--navy);font:inherit;font-size:12.5px;
  font-weight:700;cursor:pointer}
.xlbtn:hover{background:#F2F6FB;border-color:var(--navy-l)}
.xlbtn:active{transform:translateY(1px)}

.row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.row:hover{background:#F2F6FB;border-color:var(--line)}
.row .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px #fff}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:900;font-variant-numeric:tabular-nums;font-size:14px;color:var(--navy)}
.row.city .v{font-size:15px}
.sec{font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:.02em;
  padding:11px 8px 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sec:first-child{padding-top:2px}
.row.x .dot{background:#fff;border:2px dashed var(--ink3);box-shadow:none}
.row.x .v{color:var(--ink2)}
.nores{font-size:12.5px;color:var(--ink2);line-height:1.7;padding:14px 8px;text-align:center}
.flash{position:fixed;inset-inline:0;bottom:24px;margin:auto;width:max-content;max-width:86vw;
  background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;
  border-radius:999px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9999}
.flash.on{opacity:1;transform:none}

.legend{padding:11px 15px;border-top:1px solid var(--line);background:#FBFCFE;flex:0 0 auto}
.legend .lt{font-size:11px;font-weight:800;color:var(--ink2);margin-bottom:7px}
.bins{display:flex;gap:0;border-radius:6px;overflow:hidden}
.bins i{flex:1;height:11px}
.bl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:4px;font-variant-numeric:tabular-nums}

.note{border-radius:9px;padding:10px 13px;font-size:12.5px;line-height:1.6;margin-bottom:11px}
.note.y{background:var(--ybg);border:1px solid var(--ybd)}
.note.g{background:var(--gbg);border:1px solid var(--gbd)}
.note b{font-weight:800}
.mini{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--navy)}
.mini:hover{border-color:var(--navy)}
.mini.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar{height:7px;background:#E8EEF6;border-radius:99px;overflow:hidden;margin:8px 0 5px}
.bar i{display:block;height:100%;background:var(--navy);width:0;transition:width .3s}

.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 10px 34px rgba(11,46,91,.22)}
.leaflet-popup-content{margin:13px 15px;font-family:var(--font);direction:rtl;text-align:right;min-width:208px}
.pp h3{margin:0 0 3px;font-size:14.5px;color:var(--navy);font-weight:800;line-height:1.35}
.pp .ad{font-size:12px;color:var(--ink2);margin-bottom:9px}
.pp table{width:100%;border-collapse:collapse;font-size:12.5px}
.pp td{padding:2.5px 0}
.pp td:last-child{text-align:left;font-weight:800;font-variant-numeric:tabular-nums}
.pp .big{font-size:19px;font-weight:900;color:var(--navy)}
.tip{background:rgba(11,46,91,.94);color:#fff;border:0;border-radius:7px;padding:4px 9px;
  font-family:var(--font);font-size:12px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.22)}
.tip:before{display:none}
.leaflet-container{font-family:var(--font)}
.leaflet-control-attribution{font-size:9.5px}


.dd{position:relative}
.dd-b{display:flex;align-items:center;gap:7px;white-space:nowrap}
.dd-b i{font-style:normal;font-size:10px;opacity:.85}
.dd-m{position:absolute;inset-block-start:calc(100% + 6px);inset-inline-end:0;min-width:242px;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;z-index:900;
  box-shadow:0 14px 38px rgba(11,46,91,.3)}
.dd-i{display:flex;align-items:flex-start;gap:8px;width:100%;background:none;border:0;border-radius:9px;
  padding:8px 10px;font-size:13px;color:var(--ink);text-align:start;line-height:1.35}
.dd-i:hover{background:#EEF4FC}
.dd-i.on{background:#E3EDF9}
.dd-i.on b{color:var(--navy)}
.dd-i b{flex:1;font-weight:800}
.dd-i .ck{width:13px;flex:0 0 auto;color:var(--navy);font-size:12px;line-height:1.5}
.dd-i .sub{display:block;font-size:11px;color:var(--ink3);font-weight:600;margin-top:1px}
.warn-pill{font-size:11.5px;color:#FFE4B5;font-weight:700;background:rgba(255,255,255,.14);
  border-radius:999px;padding:4px 11px;line-height:1.35;max-width:300px}
.onlyM{display:none}



@media (max-width:1800px){ .eyebrow{display:none} .top{gap:6px 10px}
  .seg button{padding:4px 10px;font-size:12px} .tbtn{padding:5px 10px;font-size:11.5px} }
@media (max-width:1700px){ .kpi .k4{display:none} .kpi{gap:11px} }
@media (max-width:1500px){ .top h1{font-size:14px} }
@media (max-width:1320px){ .kpi .k3{display:none} }
@media (max-width:860px){
  .top{flex-wrap:wrap;gap:8px 10px;padding:8px 12px}
  .top h1{font-size:14px}
  .eyebrow{font-size:9px}
  .sp{display:none}
  .onlyM{display:inline-flex}
  .kpi{order:5;width:100%;justify-content:space-between;gap:8px}
  .kpi b{font-size:15px}
  .main{position:relative}
  .side{position:absolute;inset-block:0;inset-inline-start:0;width:min(89vw,340px);z-index:700;
    transform:translateX(102%);transition:transform .25s ease;box-shadow:-10px 0 34px rgba(11,46,91,.22)}
  .side.open{transform:none}
  .dd-m{inset-inline-end:auto;inset-inline-start:0}
}




html.big .top{padding:9px 20px;gap:10px 17px}
html.big .top h1{font-size:21px}
html.big .eyebrow{display:block;font-size:12px}
html.big .seg button{font-size:16.5px;padding:7px 16px}
html.big .seg{border-radius:11px;padding:4px}
html.big .tbtn{font-size:15.5px;padding:7px 15px;border-radius:10px}
html.big .kpi{gap:20px}
html.big .kpi b{font-size:24px}
html.big .kpi span{font-size:12.5px}
html.big .kpi .k3,html.big .kpi .k4{display:block}
html.big .side{width:455px}
html.big .sh{font-size:18px;padding:13px 18px}
html.big .sb{padding:0 18px 14px}
html.big .qwrap{padding:14px 0 3px}
html.big .srch{font-size:17px;padding:11px 15px;border-radius:11px}
html.big .xlbtn{font-size:15px;padding:9px 12px}
html.big .row{padding:9px 10px;gap:11px}
html.big .row .dot{width:14px;height:14px}
html.big .row .t b{font-size:17px}
html.big .row .t span{font-size:14.5px}
html.big .row .v{font-size:19px}
html.big .row.city .v{font-size:21px}
html.big .sec{font-size:14px;padding:13px 10px 5px}
html.big .nores{font-size:16px}
html.big .legend{padding:13px 18px}
html.big .legend .lt{font-size:14px}
html.big .bins i{height:14px}
html.big .bl{font-size:13.5px}
html.big .note{font-size:15.5px;padding:12px 15px}
html.big .mini{font-size:15px;padding:6px 13px}
html.big .turn{padding:14px 16px 16px}
html.big .turn .lt{font-size:14px}
html.big .turn .trow{font-size:15px}
html.big .tsum{font-size:15px}
html.big .warn-pill{font-size:14.5px;padding:6px 14px}
html.big .tip{font-size:15.5px;padding:6px 12px}
html.big .leaflet-popup-content{min-width:265px;margin:16px 19px}
html.big .pp h3{font-size:18.5px}
html.big .pp .ad{font-size:14.5px}
html.big .pp table{font-size:15.5px}
html.big .pp .big{font-size:24px}
html.big .dd-i{font-size:16px;padding:10px 13px}
html.big .dd-i .sub{font-size:13px}
html.big .dd-m{min-width:300px}
html.big .leaflet-control-zoom a{width:36px;height:36px;line-height:36px;font-size:22px}
html.big .flash{font-size:16px;padding:13px 24px}


@media (max-width:2999px){
  html.big .eyebrow{display:none}
  html.big .top{gap:8px 12px;padding:7px 16px}
  html.big .top h1{font-size:18px}
  html.big .seg button{font-size:14px;padding:5px 11px}
  html.big .tbtn{font-size:13.5px;padding:5px 10px}
  html.big .kpi{gap:14px}
  html.big .kpi b{font-size:21px}
  html.big .kpi span{font-size:11.5px}
}
@media (max-width:1850px){ html.big .kpi .k4{display:none} }
@media (max-width:1600px){ html.big .kpi .k3{display:none} html.big .side{width:390px} }


@keyframes lowPulse{0%,100%{stroke-width:3;stroke-opacity:1}50%{stroke-width:13;stroke-opacity:.35}}
path.lowturn{animation:lowPulse 1.3s ease-in-out infinite}
.turn{border-top:1px solid var(--line);padding:11px 13px 13px;background:var(--s1)}
.turn .trow{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12.5px;color:var(--ink2)}
.turn input[type=range]{flex:1 1 auto;accent-color:#d03b3b}
.turn .tsum{margin-top:9px;font-size:13px;color:var(--ink2);line-height:1.6}
.turn .tsum b{font-size:19px;color:#b3201f;font-weight:800}
.tlist{margin-top:8px;max-height:168px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.tlist div{display:flex;gap:8px;align-items:baseline;padding:6px 9px;font-size:12.5px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.tlist div:last-child{border-bottom:0}
.tlist div:hover{background:#fdf4f4}
.tlist b{color:#b3201f;font-variant-numeric:tabular-nums;flex:0 0 auto}
.tlist span{color:var(--ink3);margin-inline-start:auto;flex:0 0 auto}
.tlist em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn.live{background:#d03b3b;border-color:#d03b3b;color:#fff}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div>
      <div class="eyebrow">גרסת הדגמה · כל הנתונים מומצאים</div>
      <h1>מפת מוקדי ההצבעה החזקים</h1>
    </div>

    <div class="seg" title="איזו מפלגה מוצגת">
      <button id="pLb" class="on">מפלגה א׳</button>
      <button id="pMhl">מפלגה ב׳</button>
      <button id="pPe">מפלגה ג׳</button>
      <button id="pKn">מפלגה ד׳</button>
      <button id="pYsr" class="hide">מפלגה ה׳</button>
      <button id="pByd" class="hide">מפלגה ו׳</button>
    </div>

    <div class="seg" title="איזו מערכת בחירות">
      <button id="e26">כנסת 26</button>
      <button id="e25" class="on">כנסת 25</button>
      <button id="e24">כנסת 24</button>
    </div>

    <div class="seg" title="רזולוציית התצוגה">
      <button id="mCity">לפי יישוב</button>
      <button id="mSite" class="on">לפי מוקד</button>
    </div>

    <div class="seg" title="מה הצבע של המוקד אומר">
      <button id="cVotes" class="on">צבע: קולות</button>
      <button id="cGap">צבע: פער בהצבעה</button>
    </div>

    <div class="sp"></div>

    <div class="kpi">
      <div><b id="kVotes">—</b><span>קולות</span></div>
      <div><b id="kSites">—</b><span>מוקדים</span></div>
      <div class="k3"><b id="kCities">—</b><span>יישובים</span></div>
      <div class="k4"><b id="kExact">—</b><span>כתובת מדויקת</span></div>
    </div>

    <div class="dd">
      <button class="tbtn dd-b" id="ddBtn" title="רקע המפה">
        <span id="ddLab">מפה מוטמעת</span><i>▾</i>
      </button>
      <div class="dd-m hide" id="ddMenu"></div>
    </div>
    <button class="tbtn" id="fit">כל הארץ</button>
    <button class="tbtn" id="tBtn" title="סימון מוקדים עם אחוזי הצבעה נמוכים">אחוזי הצבעה</button>
    <button class="tbtn" id="bigBtn" title="מגדיל את כל התצוגה — למסך הגדול בחמ״ל">מסך גדול</button>
    <button class="tbtn onlyM" id="panelBtn">רשימה</button>
  </div>

  <div class="main">
    <div class="side">
      <div class="sh">
        <span id="listTitle">מוקדי הצבעה</span>
        <span id="listN" style="color:var(--ink3);font-weight:700;font-size:12px">—</span>
      </div>
      <div class="sb">
        <div class="qwrap">
        <input type="text" id="q" class="srch" placeholder="חיפוש יישוב, מוסד, רחוב או מספר קלפי…">
        <button id="xl" class="xlbtn hide" title="מוריד את כל מה שהחיפוש מצא, עם כל הנתונים">
          הורדת אקסל של התוצאות</button>
        </div>

        <div id="list"></div>
      </div>
      <div class="turn hide" id="turnBox">
        <div class="lt">אחוזי הצבעה · <span id="tWhen">אין נתונים</span></div>
        <div class="trow"><span>אדום:</span><input type="range" id="tMax" min="10" max="90" value="35"><b id="tMaxL">35%</b></div>
        <div class="tsum"><b id="tLow">0</b> מוקדים שלנו מתחת לסף<br><span id="tAll"></span></div>
        <div class="tlist hide" id="tList"></div>
        <div class="trow"><button class="tbtn" id="tDemo">נתוני הדגמה</button>
          <button class="tbtn" id="tLoad">טען קובץ ועדה</button>
          <button class="tbtn hide" id="tClear">נקה</button></div>
        <div class="trow" id="tNetRow">
          <button class="tbtn" id="tPull" title="מושך עכשיו את הקובץ שפורסם">בדוק עדכון</button>
          <button class="tbtn" id="tAuto" title="בודק לבד כל שתי דקות — חשוב למסך שתלוי כל היום">מתעדכן לבד</button>
        </div>
        <input type="file" id="tFile" accept=".csv,.txt" style="display:none">
      </div>
      <div class="legend">
        <div class="lt" id="legTitle">קולות למוקד</div>
        <div class="bins" id="legBins"></div>
        <div class="bl"><span id="legLo">מעט</span><span id="legHi">הרבה</span></div>
        <div class="bl" style="justify-content:flex-start;gap:5px;flex-wrap:wrap">
          <span>מדרגות:</span><span id="legMid" style="flex:1 1 0;min-width:0"></span>
        </div>
        <div class="bl hide" id="legEx" style="justify-content:flex-start;
          flex-wrap:wrap;gap:0 6px;align-items:flex-start;
          margin-top:6px;color:var(--ytx);line-height:1.55"></div>
        <div class="bl hide" id="legSum" style="justify-content:flex-start;
          margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
          line-height:1.6;display:block"></div>
      </div>
    </div>
    <div id="map"></div>
    <div class="mapmsg">
      <span id="tileWarn" class="hide warn-pill"></span>
      <span id="zoomHint" class="hide warn-pill"></span>
    </div>
  </div>

</div>
